name: Design feedback
description: Question an assumption in a design document
title: "[design-feedback] §<section>: <one-line summary>"
labels: ["design-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for engaging with the design.

        NaviKB is early-alpha (research / example) — see
        [status](https://github.com/Laurent00TT/navikb/blob/main/docs/status.md).
        The design is a real part of the contribution here; pushing back
        on assumptions is valuable.

        Please fill out the fields below so the discussion stays
        concrete. Field templates mirror the format in
        [CONTRIBUTING.md](https://github.com/Laurent00TT/navikb/blob/main/CONTRIBUTING.md).

  - type: dropdown
    id: document
    attributes:
      label: Which document
      description: The design document this feedback targets
      options:
        - docs/design/architecture.md
        - docs/design/navigation-first.md
        - docs/design/security-model.md
        - docs/design/comparison.md
        - docs/status.md
        - README.md
        - Other (specify in "Section" below)
    validations:
      required: true

  - type: input
    id: section
    attributes:
      label: Section
      description: 'Heading or §number, e.g. "§3 Retrieve" or "## Threat model"'
      placeholder: "§3 Retrieve"
    validations:
      required: true

  - type: textarea
    id: assumption
    attributes:
      label: The assumption I'm questioning
      description: Quote or paraphrase what the doc claims
      placeholder: |
        The doc states: "RRF over score-fusion because different
        channels' score scales are not commensurable..."
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Why I think it's worth revisiting
      description: Evidence, reference paper, alternative approach
      placeholder: |
        Sparse-Dense Fusion (Lin et al. 2023, [link]) trains a single
        late-fusion weight per channel and shows +X% Recall@10 on
        MS MARCO vs RRF. Worth considering even at the cost of a
        training dependency.
    validations:
      required: true

  - type: textarea
    id: resolution
    attributes:
      label: What would convince me either way
      description: What data or argument would resolve this for you
      placeholder: |
        A small experiment on our golden set would settle it. Or if
        the design doc added a paragraph explicitly addressing why
        the training dependency is the dealbreaker, I'd accept that.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        We commit to reading every issue. We do not commit to
        changing the design just because feedback was given — the
        design has to actually improve, not just compromise.
