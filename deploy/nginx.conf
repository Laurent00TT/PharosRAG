# pharos 多副本负载均衡(阶段 F,docs/SCALE_OUT.md §5-F)。挂到 nginx 容器 /etc/nginx/conf.d/default.conf。
#
# 设计要点(阶段F 审查逐条落地):
#  1. **开源 nginx 无主动健康检查**(那是 Plus 特性)—— 只有被动 max_fails/fail_timeout + proxy_next_upstream 重试。
#     故"docker kill 副本无感"靠 proxy_next_upstream:命中死副本 connect 失败 -> nginx 换下一个副本重发。
#  2. **Docker DNS + upstream 动态解析**:开源 nginx 里 upstream `server ... resolve` 自 1.27.3 起可用(镜像钉 1.27)。
#     配 resolver 127.0.0.11(Docker 内嵌 DNS)+ upstream zone,nginx 按 `pharos` 服务名返回的**全部副本 IP** 轮询,
#     且 `--scale pharos=N` 增减副本在 valid= 窗口内生效 —— 不是"启动解析一次就固化"(那是经典坑,本配置规避)。
#  3. **POST 也重试**(non_idempotent):/v1/retrieve /v1/ask 是 POST,默认 nginx 不跨副本重试非幂等请求;
#     retrieve 语义只读、ask 幂等(重发只是再算一次),故显式加 non_idempotent —— 被 kill 副本上的**在途**请求
#     也能落到健康副本,达成"无感"(不止"未命中死副本的请求无感")。代价:极端下 ask 可能重复触发 LLM,可接受。
#  4. **connect 超时短**:死副本 connect 默认等 60s;设 2s 快速失败进重试,让 kill 在秒级被绕过。

resolver 127.0.0.11 valid=10s ipv6=off;      # Docker 内嵌 DNS;valid=10s -> scale 增减副本 10s 内反映到轮询集合

upstream pharos_pool {
    zone pharos_pool 64k;                      # 共享内存区:upstream `resolve` 动态更新副本集合的必需项
    server pharos:8787 resolve max_fails=1 fail_timeout=5s;   # 按 DNS 全部副本 IP 轮询;被动摘除(1 次失败 -> 5s 内不再选)
    keepalive 32;                             # 到上游的长连接池(降 TCP 握手税)
}

server {
    listen 80;

    # nginx 自身存活探针(仅证明 nginx 进程起来了;不代表后端就绪 —— 后端就绪看 pharos /readyz)
    location = /_nginx_health { access_log off; return 200 "nginx ok\n"; }

    location / {
        proxy_pass http://pharos_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";        # 复用 keepalive 到上游
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ⭐ docker kill 副本无感:连接失败/超时/网关 5xx -> 换下一个副本重发(non_idempotent 让 POST 也重试)
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 3;           # 最多试 3 个副本(避免所有副本挂时无限重试)
        proxy_next_upstream_timeout 15s;

        proxy_connect_timeout 2s;              # 死副本 connect 快速失败(默认 60s 太久,kill 会卡)
        proxy_read_timeout 130s;               # > 推理 read 120s;/v1/ask 走 LLM 可能更久,按需上调
        proxy_send_timeout 10s;
    }
}
